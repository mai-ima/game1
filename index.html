<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0d" />
<meta name="description" content="OPERATION CRIMSON — ブラウザで動作するタクティカルFPS。制作: Opus 5 / PROCYON ENGINE" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>OPERATION CRIMSON</title>
<style>
  /* ===== 起動時に即座に表示される最小ブートスクリーン ===== */
  :root{
    --crimson:#d9482f;
    --anthropic:#d97757;
    --ink:#0a0b0d;
    --paper:#f2efe9;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;background:var(--ink);
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    color:var(--paper);
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;
  }
  canvas{display:block}
  #app{position:fixed;inset:0}

  /* ブート画面 */
  #boot{
    position:fixed;inset:0;z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%, #17181c 0%, #0a0b0d 62%);
    transition:opacity .7s cubic-bezier(.4,0,.2,1);
  }
  #boot.gone{opacity:0;pointer-events:none}

  /* Opus 5（製作）のマーク: 中心のコアから弧が開く */
  .opus{width:84px;height:84px}
  .opus svg{width:100%;height:100%;overflow:visible}
  .opus path{fill:none;stroke:var(--anthropic);stroke-linecap:round;
    stroke-dasharray:200;stroke-dashoffset:200;
    animation:arcDraw .85s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes arcDraw{to{stroke-dashoffset:0}}
  .opus circle{fill:var(--anthropic);opacity:0;transform-origin:48px 48px;
    animation:corePop .5s .5s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes corePop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

  #boot .wordmark{
    margin-top:26px;font-size:12px;letter-spacing:.42em;text-indent:.42em;
    font-weight:500;color:#9aa0a6;text-transform:uppercase;
    opacity:0;animation:fadeUp .8s .55s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:.85;transform:none}}

  /* 進捗バー */
  #bootBar{
    margin-top:42px;width:184px;height:2px;background:rgba(255,255,255,.09);
    border-radius:2px;overflow:hidden;
    opacity:0;animation:fadeUp .8s .75s cubic-bezier(.16,1,.3,1) forwards;
  }
  #bootFill{
    height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,var(--anthropic),var(--crimson));
    transition:width .35s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 12px rgba(217,119,87,.65);
  }
  #bootPct{
    margin-top:13px;font-size:10px;letter-spacing:.24em;color:#6b7075;
    font-variant-numeric:tabular-nums;
    opacity:0;animation:fadeUp .8s .75s cubic-bezier(.16,1,.3,1) forwards;
  }
  #bootErr{
    position:absolute;bottom:26px;left:20px;right:20px;text-align:center;
    font-size:12px;color:#e0705c;line-height:1.7;white-space:pre-wrap;
  }
  /* 非対応時 */
  .nowebgl{max-width:420px;text-align:center;line-height:1.9;font-size:13px;color:#c9ccd0;padding:0 24px}
</style>
</head>
<body>
  <div id="app"></div>

  <div id="boot">
    <div class="opus" id="bootMark"></div>
    <div class="wordmark">Opus 5</div>
    <div id="bootBar"><div id="bootFill"></div></div>
    <div id="bootPct">読み込み中 0%</div>
    <div id="bootErr"></div>
  </div>

<script>
  // Opus 5 マークの弧を生成（4本 + コア）
  (function(){
    var host=document.getElementById('bootMark');
    if(!host) return;
    var arcs=[[20,3.4,200,0.05],[28,3.0,174,0.13],[36,2.6,148,0.21],[44,2.2,122,0.29]];
    var d='';
    for(var i=0;i<arcs.length;i++){
      var r=arcs[i][0], w=arcs[i][1], span=arcs[i][2], delay=arcs[i][3];
      var a0=-90-span/2, a1=a0+span;
      var x0=48+r*Math.cos(a0*Math.PI/180), y0=48+r*Math.sin(a0*Math.PI/180);
      var x1=48+r*Math.cos(a1*Math.PI/180), y1=48+r*Math.sin(a1*Math.PI/180);
      var large=Math.abs(span)>180?1:0;
      d+='<path d="M '+x0.toFixed(2)+' '+y0.toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+
         x1.toFixed(2)+' '+y1.toFixed(2)+'" stroke-width="'+w+'" style="animation-delay:'+delay+'s"/>';
    }
    host.innerHTML='<svg viewBox="0 0 96 96" aria-hidden="true">'+d+
      '<circle cx="48" cy="48" r="7"/></svg>';
  })();

  // 進捗APIをグローバル公開（main.js から呼ぶ）
  window.__boot = {
    set: function(p, label){
      var f=document.getElementById('bootFill');
      var t=document.getElementById('bootPct');
      if(f) f.style.width = Math.max(0,Math.min(100,p)) + '%';
      if(t) t.textContent = (label || '読み込み中') + ' ' + Math.round(p) + '%';
    },
    done: function(){
      var b=document.getElementById('boot');
      if(b){ b.classList.add('gone'); setTimeout(function(){ b.remove(); }, 800); }
    },
    fail: function(msg){
      var e=document.getElementById('bootErr');
      if(e) e.textContent = msg;
    }
  };

  // WebGL2 サポート判定
  (function(){
    var ok=false;
    try{
      var c=document.createElement('canvas');
      ok = !!(c.getContext('webgl2'));
    }catch(e){ ok=false; }
    if(!ok){
      document.getElementById('boot').innerHTML =
        '<div class="nowebgl"><b style="font-size:15px;letter-spacing:.1em">WebGL 2.0 が利用できません</b><br><br>'+
        'このゲームは WebGL 2.0 を必要とします。<br>'+
        'ブラウザを最新版に更新するか、<br>ハードウェアアクセラレーションを有効にしてください。</div>';
      window.__NO_WEBGL2__ = true;
    }
  })();

  window.addEventListener('error', function(ev){
    if(window.__boot && document.getElementById('boot')) {
      window.__boot.fail('起動エラー: ' + (ev.message || 'unknown'));
    }
  });
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
