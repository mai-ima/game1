<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>武器ビューア | OPERATION CRIMSON</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0b0d;
    font-family:"Helvetica Neue",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#f2efe9}
  canvas{display:block}
  #app{position:fixed;inset:0}
  #boot{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
    background:#0a0b0d;transition:opacity .5s;font-size:12px;letter-spacing:.2em;color:#8a9096}
  #boot.gone{opacity:0;pointer-events:none}
  #hud{position:fixed;left:14px;top:14px;font-size:12px;letter-spacing:.08em;
    color:#c8ccd0;background:rgba(0,0,0,.5);padding:10px 14px;border-radius:6px;line-height:1.9}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">武器モデル生成中…</div>
  <div id="hud">武器ビューア（開発用）</div>
<script>
  window.__boot={set(){},done(){const b=document.getElementById('boot');if(b){b.classList.add('gone');setTimeout(()=>b.remove(),600);}},
    fail(m){const b=document.getElementById('boot');if(b)b.textContent='エラー: '+m;}};
</script>
<script type="module" src="/src/weaponview.js"></script>
</body>
</html>
